<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gymventory</title>
<meta name="description" content="Gymventory — dziennik treningowy ze znajomymi i wyzwaniami">
<meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1115" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gymventory">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="config.js"></script>
<script>window.GV_VERSION='2.1'</script>
<style>
/* Layout: one-column gym log, steel-chalk ground, cobalt like a 20 kg plate; condensed numerals read like a gym scoreboard. Bottom tab bar, sheets slide over for logging. */
:root{
  --bg:#eceef1; --surface:#ffffff; --surface-2:#f5f6f8; --fg:#14181d; --muted:#5a6370; --line:#d5dae1;
  --accent:#1e4dcf; --accent-soft:#e3e9fb; --accent-ink:#ffffff;
  --pr:#b67b00; --pr-soft:#fbf0d4; --pr-ink:#ffffff; --warn:#b9410c; --warn-soft:#fbe7dc; --good:#157a3b; --good-soft:#dcf2e4;
  --shadow:0 1px 2px rgba(20,24,29,.06),0 4px 16px rgba(20,24,29,.06);
  --f-display:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1115; --surface:#171b21; --surface-2:#1d222a; --fg:#e7eaee; --muted:#98a1ac; --line:#2a313a;
  --accent:#7090ff; --accent-soft:#1c2648; --accent-ink:#0a0d13;
  --pr:#f0b53a; --pr-soft:#3a2d10; --pr-ink:#1a1405; --warn:#ff8f57; --warn-soft:#3b2117; --good:#4fd282; --good-soft:#15301f;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1115; --surface:#171b21; --surface-2:#1d222a; --fg:#e7eaee; --muted:#98a1ac; --line:#2a313a;
  --accent:#7090ff; --accent-soft:#1c2648; --accent-ink:#0a0d13;
  --pr:#f0b53a; --pr-soft:#3a2d10; --pr-ink:#1a1405; --warn:#ff8f57; --warn-soft:#3b2117; --good:#4fd282; --good-soft:#15301f;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light;-webkit-text-size-adjust:100%}
html,body{height:100%;margin:0}
img{max-width:100%}
body{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}

.app{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:22px;height:10px;border-radius:2px;background:var(--accent);position:relative}
.brand i::before,.brand i::after{content:"";position:absolute;top:-4px;width:5px;height:18px;border-radius:1px;background:var(--fg)}
.brand i::before{left:-3px}.brand i::after{right:-3px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;background:none;border:0;padding:6px 0;text-align:right}
.sync b{width:7px;height:7px;border-radius:50%;background:var(--good)}
.sync.err b{background:var(--warn)} .sync.local b{background:var(--muted)}

h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;letter-spacing:.01em}
h2{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.1;letter-spacing:.02em}
h3{font-size:15px;font-weight:600}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:0 8px}
.btn.danger{color:var(--warn)}
.btn.danger.armed{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-size:20px;line-height:1}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;white-space:nowrap}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px}
.tag.pr{background:var(--pr-soft);color:var(--pr)}
.tag.wu{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.good{background:var(--good-soft);color:var(--good)}
input[type=text],input[type=number],input[type=date],input[type=search],select{min-height:42px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* Day */
.dayhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.dayhead .mid{flex:1;min-width:0}
.summary{display:flex;gap:18px;flex-wrap:wrap;padding:10px 0 4px;color:var(--muted);font-size:13px}
.summary b{font-family:var(--f-display);font-size:20px;color:var(--fg);font-weight:600;margin-right:3px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%;display:block}
.entry:hover{border-color:var(--muted)}
.entry .h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.entry .cat{font-size:12px;color:var(--muted)}
.sets{display:grid;grid-template-columns:22px 1fr auto;gap:2px 10px;margin-top:8px;align-items:center}
.sets .i{color:var(--muted);font-size:12px;font-family:var(--f-display)}
.sets .v{font-family:var(--f-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.sets .v small{font-size:14px;color:var(--muted);font-weight:500}
.sets .m{display:flex;gap:4px;align-items:center;justify-content:flex-end;font-size:12px;color:var(--muted)}
.sets .wurow .v{color:var(--muted);font-weight:500}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.empty h2{color:var(--fg);margin-bottom:6px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.sugg{font-size:13px;color:var(--accent);margin-top:6px}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:20}
.tabs nav{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);font-weight:500}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}

/* Timer */
.timer{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:50;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.timer .in{max-width:728px;margin:0 auto 8px;background:var(--fg);color:var(--bg);border-radius:12px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px;pointer-events:auto;box-shadow:var(--shadow);position:relative;overflow:hidden}
.timer .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.timer .t{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;min-width:70px}
.timer button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 30%,transparent);color:var(--bg);border-radius:8px;min-height:36px;padding:0 10px}
.timer.done .in{background:var(--accent);color:var(--accent-ink)}
.timer.done button{color:var(--accent-ink)}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,#000 40%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:100%;overflow:auto;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(130px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));padding-top:max(16px,env(safe-area-inset-top,0px))}
@media (min-width:700px){.sheet-wrap{align-items:center;padding:24px}.sheet{border-radius:16px;max-height:92vh}}
.sheet-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.sheet-head .mid{flex:1;min-width:0}

/* Logger */
.stepper{display:grid;grid-template-columns:52px 1fr 52px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:var(--surface-2);font-size:24px;font-weight:500}
.stepper button:active{background:var(--accent-soft)}
.stepper input{border:0;border-radius:0;text-align:center;font-family:var(--f-display);font-size:34px;font-weight:700;min-height:64px;background:transparent;font-variant-numeric:tabular-nums}
.stepper input:focus{outline:none}
.steplabel{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.rpe{display:flex;gap:6px;flex-wrap:wrap}
.rpe .chip{min-width:44px;justify-content:center;min-height:34px}
.setlist{display:flex;flex-direction:column}
.setrow{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.setrow.sel{background:var(--accent-soft)}
.setrow .v{font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.prev{background:var(--surface-2);border-radius:8px;padding:8px 12px;font-size:13px}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;text-align:center;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-bottom:4px}
.cal button{aspect-ratio:1;max-width:100%;border:1px solid transparent;border-radius:8px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--f-display);font-size:17px;font-weight:600}
.cal button.out{color:var(--muted);opacity:.45}
.cal button.has{background:var(--accent-soft);color:var(--accent)}
.cal button.today{border-color:var(--fg)}
.cal button i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cal button:not(.has) i{visibility:hidden}

/* Lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface-2)}
.li .mid{flex:1;min-width:0}
.li .mid div:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .r{font-family:var(--f-display);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.group-h{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px;font-weight:500}

/* Volume bars */
.vol{display:grid;grid-template-columns:84px 1fr 44px;gap:6px 10px;align-items:center;font-size:13px}
.vol .track{position:relative;height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.vol .band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 14%,transparent);border-left:1px dashed var(--good);border-right:1px dashed var(--good)}
.vol .fill{position:absolute;left:0;top:3px;bottom:3px;background:var(--accent);border-radius:2px}
.vol .fill.low{background:var(--warn)}
.vol .n{font-family:var(--f-display);font-size:16px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:15px;font-weight:500;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
table.t th{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
table.t td.n{font-family:var(--f-display);font-size:18px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}

.plates{display:flex;align-items:center;gap:3px;min-height:110px;padding:8px 0;overflow-x:auto}
.plates .bar{height:14px;width:60px;background:var(--muted);border-radius:2px;flex:none}
.plates .sleeve{height:10px;width:16px;background:var(--line);flex:none}
.plate{flex:none;border-radius:3px;border:1px solid color-mix(in srgb,var(--fg) 25%,transparent);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:11px;font-weight:700;writing-mode:vertical-rl}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet.anim{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

/* Gymventory additions */
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:7px;min-height:36px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
input.titlein{border:0;background:transparent;padding:0;min-height:30px;font-weight:600;font-size:16px;border-bottom:1px dashed var(--line);border-radius:0;margin-top:4px}
input.titlein:focus{outline:none;border-bottom-color:var(--accent)}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.hcard .hmain{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 14px 4px}
.hcard .hact{display:flex;gap:2px;padding:0 6px 6px;flex-wrap:wrap}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumb{aspect-ratio:1;max-width:100%;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);padding:0;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.add{display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--muted);border-style:dashed;cursor:pointer}
.equip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:10px;display:flex;gap:10px;align-items:center;text-align:left;width:100%}
.equip .ph{width:44px;height:44px;border-radius:6px;overflow:hidden;flex:none;background:var(--surface-2)}
.equip .ph img{width:100%;height:100%;object-fit:cover;display:block}
.equip .tx{flex:1;min-width:0}
.equip .tx span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column}
.viewer img{flex:1;min-height:0;width:100%;object-fit:contain}
.viewer .vbar{display:flex;gap:8px;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ivl{position:fixed;inset:0;z-index:65;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:var(--fg);color:var(--bg);padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ivl.work{background:var(--accent);color:var(--accent-ink)}
.ivl.rest{background:var(--good);color:var(--surface)}
.ivl.done{background:var(--surface);color:var(--fg)}
.ivl .ivex{font-size:16px;font-weight:600;opacity:.9}
.ivl .ph{font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ivl .tm{font-family:var(--f-display);font-size:min(40vw,230px);font-weight:700;line-height:.95;font-variant-numeric:tabular-nums}
.ivl .meta{font-size:16px;opacity:.85}
.ivl .pbar{width:min(520px,100%);height:8px;border-radius:4px;background:color-mix(in srgb,currentColor 22%,transparent);overflow:hidden}
.ivl .pbar i{display:block;height:100%;background:currentColor}
.ivl .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.ivl .btns button{min-height:50px;padding:0 20px;border-radius:10px;border:1.5px solid currentColor;background:transparent;color:inherit;font-weight:600;font-size:16px}
.timer .lbl{display:flex;flex-direction:column;line-height:1.15;font-size:13px}
.timer .lbl small{font-size:11px;opacity:.75}
.timer.ex .bar{background:var(--pr)}
.timer.ex .lbl b{color:var(--pr)}
.timer.done.ex .in{background:var(--pr);color:var(--pr-ink)}
.timer.done.ex .lbl b{color:inherit}
.timer.done.ex button{color:var(--pr-ink)}
.lb{display:grid;grid-template-columns:20px minmax(0,1.1fr) minmax(40px,1.3fr) auto;gap:6px 10px;align-items:center;font-size:14px}
.lb .bar{height:10px;background:var(--surface-2);border-radius:3px;overflow:hidden;display:block}
.lb .bar i{display:block;height:100%;background:var(--accent)}
.lb .me{font-weight:600}
.lb .v{font-family:var(--f-display);font-size:18px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.tog input{width:20px;height:20px;accent-color:var(--accent);flex:none}

<body>

<div class="app" id="app"><div class="loading">Wczytywanie dziennika…</div></div>
<div class="timer" id="timer" hidden></div>
<div class="tabs" id="tabs"></div>
<div id="sheet"></div>
<div class="ivl" id="ivl" hidden></div>
<div class="viewer" id="viewer" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(()=>{
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pIso=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=pIso(s);d.setDate(d.getDate()+n);return iso(d)};
const nid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const fmt=(n,dp=2)=>{if(n==null||isNaN(n))return'–';const f=Math.pow(10,dp);return String(Math.round(n*f)/f).replace('.',',')};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const e1rm=(w,r)=>r<=0||w<=0?0:(r===1?w:w*(1+r/30));
const clone=o=>JSON.parse(JSON.stringify(o));
const DOW=['niedz.','pon.','wt.','śr.','czw.','pt.','sob.'];
const MON_G=['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const MON_N=['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
const dLong=s=>{const d=pIso(s);return `${DOW[d.getDay()]} ${d.getDate()} ${MON_G[d.getMonth()]}${d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''}`};
const dShort=s=>{const d=pIso(s);return `${d.getDate()}.${pad(d.getMonth()+1)}${d.getFullYear()!==new Date().getFullYear()?'.'+String(d.getFullYear()).slice(2):''}`};
const relDay=s=>{const t=today();if(s===t)return'Dziś';if(s===addDays(t,-1))return'Wczoraj';if(s===addDays(t,1))return'Jutro';const d=pIso(s);return `${d.getDate()} ${MON_G[d.getMonth()]}`};
const mmss=s=>{s=Math.max(0,Math.round(s));return `${Math.floor(s/60)}:${pad(s%60)}`};
const plural=(n,a,b,c)=>n===1?a:(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?b:c);

const CATS=['Klatka','Plecy','Nogi','Pośladki','Barki','Biceps','Triceps','Brzuch','Cardio'];
const CAT_EN={chest:'Klatka',back:'Plecy',legs:'Nogi',shoulders:'Barki',biceps:'Biceps',triceps:'Triceps',abs:'Brzuch',core:'Brzuch',cardio:'Cardio',glutes:'Pośladki',arms:'Biceps'};
const DEF_SETTINGS={inc:2.5,rest:120,restEx:180,bar:20,plates:[25,20,15,10,5,2.5,1.25],hint:true,share:true,ivl:{w:30,r:20,n:3}};
function defaultProfile(){
  const ex=[['Przysiad ze sztangą','Nogi'],['Martwy ciąg','Plecy'],['Wyciskanie sztangi leżąc','Klatka'],['Wyciskanie żołnierskie','Barki'],['Wiosłowanie sztangą','Plecy'],['Podciąganie nachwytem','Plecy','bw'],['Pompki','Klatka','bw'],['Wyciskanie hantli na skosie','Klatka'],['Pompki na poręczach','Triceps','bw'],['Rumuński martwy ciąg','Nogi'],['Wypychanie nóg na suwnicy','Nogi'],['Hip thrust','Pośladki'],['Wykroki z hantlami','Nogi'],['Unoszenie hantli bokiem','Barki'],['Ściąganie drążka wyciągu','Plecy'],['Uginanie ramion ze sztangą','Biceps'],['Prostowanie ramion na wyciągu','Triceps'],['Plank','Brzuch','time'],['Spięcia brzucha na wyciągu','Brzuch'],['Bieżnia','Cardio','cardio'],['Rower stacjonarny','Cardio','cardio'],['Orbitrek','Cardio','cardio']]
  .map(([name,cat,type='w'])=>({id:nid(),name,cat,type}));
  return {v:2,exercises:ex,routines:[],settings:clone(DEF_SETTINGS),body:[]};
}
function migrate(p){p=clone(p);p.exercises??=[];p.routines??=[];p.body??=[];p.settings={...clone(DEF_SETTINGS),...(p.settings||{})};
  p.body.forEach(b=>{b.id??=b.d+(b.t?'-'+b.t:'')});p.me??={};
  p.exercises.forEach(e=>{if(e.type==='time'&&/bieżni|biezni|bieg|rower|orbitrek|wioślarz|ergometr/i.test(e.name))e.type='cardio'});return p}
const TYPES=[['w','Ciężar × powtórzenia'],['bw','Masa ciała (powtórzenia)'],['time','Czas (np. plank)'],['cardio','Cardio: czas, dystans, prędkość']];
const typeOpts=sel=>TYPES.map(([k,l])=>`<option value="${k}" ${k===sel?'selected':''}>${l}</option>`).join('');

/* ---------- state ---------- */
const S={profile:null,workouts:{},mode:'loading',sync:'ok'};
const ui={tab:'day',histMode:'list',progMode:'ex',histQ:'',histN:30,view:null,frMsg:'',date:today(),calMonth:today().slice(0,7),sheet:null,cat:'',q:'',armed:null,exDetail:null,orm:{w:100,r:5},plate:{w:100},bodyW:'',bodyD:today()};

let ver=0;const bump=()=>{ver++};

/* ---------- persistence: offline-first, synced to Supabase ---------- */
// Every change is written to this device first (works offline). When signed in,
// changed documents are pushed to Supabase and other devices' changes are pulled.
const LS='gv-data', LS_CFG='gv-cfg', LS_AUTH='gv-auth';
const L={docs:{},lastPull:'1970-01-01T00:00:00Z',user:null,shq:[]};
const rd=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
let CFG=null,AUTH=null;
function loadCfg(){const c=window.GV_CONFIG||window.SERIA_CONFIG||{};const l=rd(LS_CFG)||{};const url=(c.supabaseUrl||l.url||'').trim().replace(/\/+$/,'');const key=(c.supabaseAnonKey||l.key||'').trim();CFG=url&&key&&!/TWOJ|YOUR/i.test(url+key)?{url,key,fromFile:!!c.supabaseUrl}:null}
function loadLocal(){
  const d=rd(LS);if(d){Object.assign(L,d)}
  applyDocs();
  if(!S.profile){S.profile=defaultProfile();markDirty('profile');L.docs.profile.fresh=true}
}
function applyDocs(){
  S.workouts={};
  for(const id in L.docs){const x=L.docs[id];if(x.del||!x.data)continue;if(id==='profile')S.profile=migrate(x.data);else if(id.startsWith('w_'))S.workouts[id.slice(2)]=clone(x.data)}
  bump();
}
function docData(id){if(id==='profile')return clone(S.profile);const w=S.workouts[id.slice(2)];return w&&w.entries.length?clone(w):null}
function markDirty(id){const d=docData(id);L.docs[id]={data:d,at:Date.now(),dirty:true,del:!d}}
let tSave,tPush;
function queueSave(id){
  bump();markDirty(id);if(id.startsWith('w_'))shareMark(id.slice(2));
  clearTimeout(tSave);tSave=setTimeout(saveLocal,250);
  clearTimeout(tPush);tPush=setTimeout(push,1500);
}
function saveLocal(){tSave=null;if(!wr(LS,L))toast('Pamięć przeglądarki jest pełna — zrób kopię zapasową');}
function flushAll(){if(tSave){clearTimeout(tSave);saveLocal()}if(tPush){clearTimeout(tPush);push()}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushAll();else{pull();socLoad()}});
window.addEventListener('pagehide',flushAll);
window.addEventListener('online',()=>{if(!AUTH)return;setSync('busy');push().then(()=>pull())});
window.addEventListener('offline',()=>setSync('offline'));

/* --- Supabase REST --- */
class ApiErr extends Error{constructor(st,msg){super(msg);this.status=st}}
async function api(path,opt={},auth=true){
  if(!CFG)throw new ApiErr(0,'brak konfiguracji');
  if(auth){await ensureToken()}
  const h={'apikey':CFG.key,'Content-Type':'application/json',...(opt.headers||{})};
  if(auth&&AUTH)h.Authorization='Bearer '+AUTH.access_token;
  let r;try{r=await fetch(CFG.url+path,{...opt,headers:h})}catch(e){throw new ApiErr(0,'offline')}
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok)throw new ApiErr(r.status,j?.msg||j?.error_description||j?.message||j?.error||('HTTP '+r.status));
  return j;
}
function setAuth(j){AUTH={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+((j.expires_in||3600)-60)*1000,user:{id:j.user?.id,email:j.user?.email}};wr(LS_AUTH,AUTH)}
let refreshing=null;
async function ensureToken(){
  if(!AUTH)throw new ApiErr(401,'nie zalogowano');
  if(Date.now()<AUTH.expires_at)return;
  refreshing??=api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:AUTH.refresh_token})},false)
    .then(setAuth).catch(e=>{if(e.status===400||e.status===401){AUTH=null;wr(LS_AUTH,null);render()}throw e}).finally(()=>refreshing=null);
  await refreshing;
}
const AUTH_MSG=m=>/invalid login/i.test(m)?'Nieprawidłowy e-mail lub hasło.':/already registered|already been registered/i.test(m)?'To konto już istnieje — zaloguj się.':/email not confirmed/i.test(m)?'Potwierdź adres e-mail (sprawdź skrzynkę) albo wyłącz potwierdzanie w Supabase.':/password.*(6|characters|short)/i.test(m)?'Hasło musi mieć co najmniej 6 znaków.':/offline/.test(m)?'Brak internetu.':m;
async function signIn(email,pass,create){
  ui.authMsg='';ui.authBusy=true;render();
  try{
    let j;
    if(create){j=await api('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password:pass})},false);
      if(!j?.access_token){ui.authMsg='Konto utworzone. Kliknij link w e-mailu od Supabase, a potem zaloguj się tutaj.';return}}
    else j=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password:pass})},false);
    setAuth(j);
    if(L.user&&L.user!==AUTH.user.id){L.docs={};S.profile=null;S.workouts={}} // a different account was used on this device
    L.user=AUTH.user.id;
    await mergeOnLogin();
    Object.keys(S.workouts).filter(d=>d>=addDays(today(),-90)).forEach(shareMark);
    saveLocal();await push();toast('Zalogowano — dane synchronizują się');socLoad(true);
  }catch(e){ui.authMsg=AUTH_MSG(e.message)}
  finally{ui.authBusy=false;render()}
}
// First sign-in on a device: combine what is on the device with what is already on the account.
async function mergeOnLogin(){
  const remote={};let off=0,maxAt='1970-01-01T00:00:00Z';
  for(;;){const rows=await api(`/rest/v1/gv_docs?select=id,data,deleted,updated_at,server_at&order=server_at.asc&limit=500&offset=${off}`);
    for(const r of rows){remote[r.id]=r;if(r.server_at>maxAt)maxAt=r.server_at}if(rows.length<500)break;off+=500}
  const rp=remote.profile&&!remote.profile.deleted?migrate(remote.profile.data):null;
  const localHasData=S.profile&&!L.docs.profile?.fresh;
  const docs={};
  for(const id in remote){const r=remote[id];docs[id]={data:r.deleted?null:r.data,at:Date.parse(r.updated_at),dirty:false,del:!!r.deleted}}
  if(!rp){ // account is empty: upload this device
    L.docs=Object.fromEntries(Object.entries(L.docs).map(([k,v])=>[k,{...v,fresh:undefined,dirty:true}]));
    if(!S.profile){S.profile=defaultProfile();markDirty('profile')}
  }else if(!localHasData&&!Object.keys(S.workouts).length){ // nothing worth keeping here: take the account
    L.docs=docs;applyDocs();
  }else{ // both have data: merge by exercise name
    const prof=clone(rp);const byName={};prof.exercises.forEach(e=>byName[e.name.toLowerCase()]=e);const map={};
    for(const e of S.profile.exercises){const m=byName[e.name.toLowerCase()];if(m)map[e.id]=m.id;else{prof.exercises.push(e);byName[e.name.toLowerCase()]=e;map[e.id]=e.id}}
    const bd=new Set(prof.body.map(b=>b.d));S.profile.body.forEach(b=>{if(!bd.has(b.d))prof.body.push(b)});
    const rn=new Set(prof.routines.map(r=>r.name.toLowerCase()));S.profile.routines.forEach(r=>{if(!rn.has(r.name.toLowerCase()))prof.routines.push({...r,items:r.items.map(i=>map[i]||i)})});
    L.docs=docs;L.docs.profile={data:prof,at:Date.now(),dirty:true,del:false};
    const localW=S.workouts;applyDocs();
    for(const d in localW){const lw=localW[d];const id='w_'+d;const rw=S.workouts[d];
      const ents=lw.entries.map(en=>({...en,ex:map[en.ex]||en.ex}));
      if(!rw)S.workouts[d]={...lw,entries:ents};else{for(const en of ents)if(!rw.entries.find(x=>x.ex===en.ex))rw.entries.push(en)}
      markDirty(id)}
    S.profile=prof;bump();
  }
  L.lastPull=maxAt;
}
async function signOut(){flushAll();try{await push()}catch(e){}try{await api('/auth/v1/logout',{method:'POST'})}catch(e){}AUTH=null;wr(LS_AUTH,null);Object.assign(SOC,freshSoc());setSync('local');render();toast('Wylogowano. Dane zostały na tym urządzeniu.')}

let pushing=null,pushAgain=false,pulling=null,lastSyncAt=null;
async function push(){
  tPush=null;if(!CFG||!AUTH)return;
  if(pushing){pushAgain=true;return pushing}
  const run=(async()=>{
    await null; // always resolve asynchronously, so `pushing` is set before the body runs
    try{
      do{
        pushAgain=false;
        const ids=Object.keys(L.docs).filter(id=>L.docs[id].dirty);if(!ids.length)break;
        setSync('busy');
        const snap={};ids.forEach(id=>snap[id]=L.docs[id].at);
        for(let i=0;i<ids.length;i+=50){
          const rows=ids.slice(i,i+50).map(id=>({user_id:AUTH.user.id,id,data:L.docs[id].data||{},deleted:!!L.docs[id].del,updated_at:new Date(L.docs[id].at).toISOString()}));
          await api('/rest/v1/gv_docs?on_conflict=user_id,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});
        }
        ids.forEach(id=>{if(L.docs[id]&&L.docs[id].at===snap[id])L.docs[id].dirty=false});
        saveLocal();
      }while(pushAgain);
      await publishShared().catch(e=>console.warn(e));
      lastSyncAt=Date.now();setSync('ok');
      if(SOC.ready)syncChallenges().then(()=>{if(ui.tab==='team')render()}).catch(()=>{});
      uploadPending();
    }catch(e){setSync(e.status===0?'offline':'err',e);if(e.status&&e.status!==401)console.warn(e)}
    finally{pushing=null}
  })();
  pushing=run;
  return run;
}
async function pull(force){
  if(!CFG||!AUTH)return;if(pulling)return pulling;
  pulling=(async()=>{
    await null;
    try{
      const since=force?'1970-01-01T00:00:00Z':L.lastPull;let changed=false,off=0,maxAt=since;
      for(;;){
        const rows=await api(`/rest/v1/gv_docs?select=id,data,deleted,updated_at,server_at&server_at=gt.${encodeURIComponent(since)}&order=server_at.asc&limit=500&offset=${off}`);
        for(const r of rows){
          if(r.server_at>maxAt)maxAt=r.server_at;
          const at=Date.parse(r.updated_at);const loc=L.docs[r.id];
          if(loc&&loc.dirty&&loc.at>=at)continue;
          L.docs[r.id]={data:r.deleted?null:r.data,at,dirty:false,del:!!r.deleted};changed=true;
        }
        if(rows.length<500)break;off+=500;
      }
      L.lastPull=maxAt;saveLocal();
      if(changed){applyDocs();if(!S.profile){S.profile=defaultProfile();markDirty('profile')}render()}
      lastSyncAt=Date.now();if(S.sync!=='busy')setSync('ok');
    }catch(e){setSync(e.status===0?'offline':'err',e)}
    finally{pulling=null}
  })();
  return pulling;
}
setInterval(()=>{if(document.visibilityState==='visible')pull()},60000);

function setSync(s,e){S.sync=s;S.syncErr=e?AUTH_MSG(e.message):'';const el=$('#sync');if(el)el.outerHTML=syncHtml()}
function syncHtml(){
  if(!CFG||!AUTH)return `<button class="sync local" id="sync" data-act="tab" data-v="more"><b></b>${CFG?'Zaloguj, aby synchronizować':'Tylko na tym urządzeniu'}</button>`;
  const m={busy:['','Synchronizuję…'],offline:['local','Offline — zapisano na urządzeniu'],err:['err','Błąd synchronizacji'],ok:['','Zsynchronizowano'],local:['','Zsynchronizowano']}[S.sync]||['','Zsynchronizowano'];
  return `<button class="sync ${m[0]}" id="sync" data-act="syncNow" title="${esc(S.syncErr||'')}"><b></b>${m[1]}</button>`;
}

function boot(){
  loadCfg();AUTH=rd(LS_AUTH);
  loadLocal();
  if(AUTH&&!L.user)L.user=AUTH.user?.id;
  S.mode='app';S.sync=navigator.onLine?'ok':'offline';
  render();
  if(CFG&&AUTH){push().then(()=>pull()).then(()=>socLoad())}
}
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  const hadSW=!!navigator.serviceWorker.controller;let pendingReload=false;
  const tryReload=()=>{if(!ui.sheet&&!IV&&!ui.view){flushAll();location.reload()}else pendingReload=true};
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW)tryReload()});
  document.addEventListener('visibilitychange',()=>{if(pendingReload&&document.visibilityState==='visible'&&!ui.sheet&&!IV)location.reload()});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* ---------- domain ---------- */
const ex=id=>S.profile.exercises.find(e=>e.id===id);
const W=(d,create)=>{let w=S.workouts[d];if(!w&&create)w=S.workouts[d]={date:d,entries:[]};return w};
const metric=(e,s)=>e?.type==='cardio'?(s.d||0):e?.type==='time'?s.r:(s.r>0?(s.w>0?e1rm(s.w,s.r):s.r):0);
const unitOf=e=>e?.type==='time'?'s':'powt.';
let IDX=null,idxV=-1;
function index(){
  if(idxV===ver)return IDX;
  const byEx={},pr={};const dates=Object.keys(S.workouts).filter(d=>S.workouts[d].entries?.length).sort();
  for(const d of dates)for(const en of S.workouts[d].entries)(byEx[en.ex]??=[]).push({date:d,sets:en.sets||[]});
  for(const id in byEx){const e=ex(id);let best=0;
    for(const s of byEx[id]){let bi=-1,bm=0;s.sets.forEach((x,i)=>{if(x.wu)return;const m=metric(e,x);if(m>bm){bm=m;bi=i}});
      if(bi>=0&&best>0&&bm>best+1e-9)pr[`${s.date}|${id}|${bi}`]=true;
      if(bm>best)best=bm;}}
  IDX={byEx,pr,dates};idxV=ver;return IDX;
}
function suggest(id,date){
  const e=ex(id);if(!e||e.type==='cardio')return null;
  const h=(index().byEx[id]||[]).filter(s=>s.date<date&&s.sets.some(x=>!x.wu&&x.r>0));if(!h.length)return null;
  const last=h[h.length-1];const ws=last.sets.filter(s=>!s.wu&&s.r>0);
  const inc=e.inc||S.profile.settings.inc;
  const top=ws.reduce((a,b)=>(b.w>a.w||(b.w===a.w&&b.r>a.r))?b:a);
  const tops=ws.filter(s=>s.w===top.w);const target=tops[0].r;
  const allHit=tops.every(s=>s.r>=target);const maxR=Math.max(0,...ws.map(s=>s.rpe||0));
  let w=top.w,r=target,why;
  if(e.type==='time'){r=top.r+5;why='+5 s względem ostatniego razu'}
  else if(top.w===0){r=top.r+1;why='+1 powtórzenie względem ostatniego razu'}
  else if(allHit&&(!maxR||maxR<=8.5)){w=Math.round((top.w+inc)*100)/100;why=`wszystkie serie weszły${maxR?` (RPE ≤ ${fmt(maxR)})`:''} — można dołożyć ${fmt(inc)} kg`}
  else if(maxR>=9.5){why=`ostatnio RPE ${fmt(maxR)} — zostań przy tym ciężarze`}
  else{why='nie wszystkie serie weszły — powtórz ciężar i dobij powtórzenia'}
  return {w,r,why,last};
}
function setTxt(e,s){
  if(e?.type==='cardio'){const bits=[s.d?fmt(s.d,2)+' km':'',s.v?fmt(s.v,1)+' km/h':'',s.inc?fmt(s.inc,1)+'%':''].filter(Boolean).join(' · ');return `${mmss(s.r)}${bits?` <small>${bits}</small>`:''}`}
  if(e?.type==='time')return `<span>${mmss(s.r)}</span>`;
  if(!s.r&&s.s)return `${s.w?fmt(s.w)+' <small>kg</small> · ':''}${mmss(s.s)} <small>praca</small>`;
  if(e?.type==='bw'&&!s.w)return `${s.r} <small>powt.</small>`;
  return `${fmt(s.w)} <small>kg</small> × ${s.r}`;
}
function setShort(e,x){
  let t;
  if(e?.type==='cardio')t=mmss(x.r)+(x.d?' '+fmt(x.d,1)+' km':'')+(x.v?' @'+fmt(x.v,1):'');
  else if(e?.type==='time')t=mmss(x.r);
  else if(!x.r&&x.s)t=(x.w?fmt(x.w)+' kg ':'')+mmss(x.s);
  else t=(x.w?fmt(x.w)+'×'+x.r:x.r+' powt.')+(x.rpe?' @'+fmt(x.rpe):'');
  return x.wu?'('+t+')':t;
}
function prevSession(id,d){const h=(index().byEx[id]||[]).filter(s=>s.date<d&&s.sets.some(x=>!x.wu));return h[h.length-1]||null}
// Values for the next set: same set number from the previous workout, else the last set today.
function prefill(id,d){
  const e=ex(id);const sets=W(d)?.entries.find(x=>x.ex===id)?.sets||[];const done=sets.filter(x=>!x.wu).length;
  const ps=prevSession(id,d);const pws=ps?ps.sets.filter(x=>!x.wu):[];
  let src=null,from=null;
  if(pws[done]){src=pws[done];from={date:ps.date,n:done+1}}
  else if(sets.length)src=sets[sets.length-1];
  else if(pws.length){src=pws[pws.length-1];from={date:ps.date,n:pws.length}}
  const x=src||{w:e.type==='bw'?0:S.profile.settings.bar,r:e.type==='time'?60:e.type==='cardio'?1800:8};
  const o={w:fmt(x.w||0),r:e.type==='cardio'?mmss(x.r||1800):String(x.r||(e.type==='time'?60:8)),d:'',v:'',inc:'',met:'',from};
  if(e.type==='cardio'){o.v=x.v?fmt(x.v,1):'';o.inc=x.inc!=null?fmt(x.inc,1):'';o.met=x.met?fmt(x.met,1):'';o.d=''}
  return o;
}
// ACSM metabolic equations (walking below 7.5 km/h, running above)
function autoMet(v,inc){if(!v)return 0;const m=v*1000/60,g=(inc||0)/100;const vo2=v<7.5?0.1*m+1.8*m*g+3.5:0.2*m+0.9*m*g+3.5;return vo2/3.5}
const bodySorted=()=>S.profile.body.slice().sort((a,c)=>a.d.localeCompare(c.d)||(a.t||0)-(c.t||0));
const bodyKg=()=>{const b=bodySorted();return b.length?b[b.length-1].w:75};
const setKcal=x=>{const met=x.met||autoMet(x.v,x.inc);return met&&x.r?met*bodyKg()*x.r/3600:0};
function durTxt(w){const ms=(w.end||Date.now())-w.start;const m=Math.max(0,Math.floor(ms/60000));return m>=60?`${Math.floor(m/60)}:${pad(m%60)}`:`${m}<small style="font-size:13px"> min</small>`}
setInterval(()=>{const el=document.getElementById('dur');const w=S.workouts?.[ui.date];if(el&&w?.start&&!w.end)el.innerHTML=durTxt(w)},20000);
function workoutStats(w){let sets=0,vol=0,km=0,kcal=0;for(const en of w?.entries||[]){const e=ex(en.ex);for(const s of en.sets||[]){if(s.wu)continue;sets++;if(e?.type==='cardio'){km+=s.d||0;kcal+=setKcal(s)}else if(e?.type!=='time')vol+=(s.w||0)*(s.r||0)}}return{n:w?.entries?.length||0,sets,vol,km,kcal}}
function weeklyVolume(endDate){
  const res={};const start=addDays(endDate,-6);
  for(const d in S.workouts){if(d<start||d>endDate)continue;for(const en of S.workouts[d].entries){const e=ex(en.ex);if(!e||e.cat==='Cardio')continue;const n=(en.sets||[]).filter(s=>!s.wu).length;res[e.cat]=(res[e.cat]||0)+n}}
  return res;
}

/* ---------- charts ---------- */
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r||1)));const f=r/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function lineChart(pts,unit=''){
  if(pts.length<2)return `<p class="muted small">Wykres pojawi się po co najmniej dwóch sesjach.</p>`;
  const W0=600,H0=220,L=44,R=14,T=14,B=26;
  const xs=pts.map(p=>pIso(p.x).getTime());let x0=Math.min(...xs),x1=Math.max(...xs);if(x1===x0)x1=x0+864e5;
  let y0=Math.min(...pts.map(p=>p.y)),y1=Math.max(...pts.map(p=>p.y));const padY=(y1-y0)*0.12||Math.max(1,y1*0.05);y0-=padY;y1+=padY;
  const st=niceStep((y1-y0)/4);y0=Math.floor(y0/st)*st;y1=Math.ceil(y1/st)*st;
  const sx=t=>L+(t-x0)/(x1-x0)*(W0-L-R),sy=v=>T+(1-(v-y0)/(y1-y0))*(H0-T-B);
  let g='';for(let v=y0;v<=y1+1e-9;v+=st){const y=sy(v).toFixed(1);g+=`<line x1="${L}" x2="${W0-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${+y+4}" text-anchor="end">${fmt(v,st<0.1?2:st<1?1:0)}</text>`}
  const P=pts.map((p,i)=>[sx(xs[i]),sy(p.y)]);
  const line=P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${P[P.length-1][0].toFixed(1)} ${H0-B} L${P[0][0].toFixed(1)} ${H0-B} Z`;
  const last=P[P.length-1];
  return `<svg class="chart" viewBox="0 0 ${W0} ${H0}" role="img" aria-label="Wykres postępu">${g}
  <path d="${area}" fill="var(--accent)" fill-opacity=".1"/>
  <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
  ${P.length<40?P.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="var(--accent)"/>`).join(''):''}
  <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="${L}" y="${H0-6}">${dShort(pts[0].x)}</text><text x="${W0-R}" y="${H0-6}" text-anchor="end">${dShort(pts[pts.length-1].x)}</text></svg>`;
}

function addScaleMeasurement(m){
  if(S.profile.body.some(x=>x.t&&Math.abs(x.t-m.t)<90000&&Math.abs(x.w-m.w)<0.3)){slog(`pomiar ${m.w} kg już zapisany`);return}
  if(SC.pending.some(x=>Math.abs(x.t-m.t)<90000))return;
  if((S.profile.settings.scaleSkip||[]).some(t=>Math.abs(t-m.t)<90000)){slog(`pomiar ${m.w} kg wcześniej pominięty`);return}
  const prev=bodySorted().filter(x=>x.t!==m.t).pop();
  if(prev&&Math.abs(m.w-prev.w)>Math.max(6,prev.w*0.08)){SC.pending.push(m);slog(`pomiar ${m.w} kg do potwierdzenia`);scaleRender();return}
  saveScale(m);slog(`zapisano ${m.w} kg${m.imp?', impedancja '+m.imp:''}`);
}
function onScaleData(ev){
  const dv=ev.target.value;slog('← '+hex(dv));
  if(dv.byteLength===1&&dv.getUint8(0)===0x03){finishScale('end');return}
  for(let o=0;o+13<=dv.byteLength;o+=13){const m=parseMi(dv,o);if(m.w>5&&m.w<300){if(SC.done||Date.now()-m.t<120000)showLive(m.w);if(m.stable&&!m.removed)addScaleMeasurement(m)}}
}
async function watchLive(dev){
  if(!dev.watchAdvertisements)return;
  try{dev.addEventListener('advertisementreceived',ev=>{const sd=ev.serviceData?.get(MI.bcFull);if(!sd||sd.byteLength<13)return;const m=parseMi(sd,0);if(m.w>5&&m.w<300){showLive(m.w);if(m.stable&&!m.removed)addScaleMeasurement(m)}});await dev.watchAdvertisements();slog('odczyt na żywo z reklam BLE włączony')}
  catch(e){slog('odczyt na żywo niedostępny: '+e.message)}
}
async function scaleConnect(all){
  if(!navigator.bluetooth){toast('Ta przeglądarka nie obsługuje Bluetooth');return}
  if(SC.busy)return;Object.assign(SC,{busy:true,got:0,done:false,live:0});render();
  try{
    sstat('Wybierz z listy wagę „MIBFS”…');
    const opt={optionalServices:[MI.bc,MI.cust,0x180a,0x1805]};
    const dev=await navigator.bluetooth.requestDevice(all?{acceptAllDevices:true,...opt}:{filters:[{name:'MIBFS'},{namePrefix:'MIBFS'},{namePrefix:'MI SCALE'},{services:[MI.bc]}],...opt});
    SC.dev=dev;slog('urządzenie: '+(dev.name||'(bez nazwy)'));
    dev.addEventListener('gattserverdisconnected',()=>{slog('rozłączono');if(!SC.done){SC.done=true;sstat(SC.got?`Zapisano ${SC.got} ${plural(SC.got,'pomiar','pomiary','pomiarów')}. Waga się rozłączyła.`:'Waga się rozłączyła, zanim przesłała pomiary. Stań na niej ponownie i od razu połącz.')}SC.busy=false;scaleRender();render()});
    watchLive(dev);
    sstat('Łączę z wagą…');const gatt=await dev.gatt.connect();
    const bc=await gatt.getPrimaryService(MI.bc);slog('usługa składu ciała (181b) dostępna');
    try{const cs=await gatt.getPrimaryService(MI.cust);await wv(await cs.getCharacteristic(MI.cfg),[0x06,0x04,0x00,0x00]);slog('jednostka ustawiona na kg')}catch(e){slog('pominięto ustawienie jednostki: '+e.message)}
    try{const n=new Date(),y=n.getFullYear();await wv(await bc.getCharacteristic(MI.time),[y&0xff,y>>8,n.getMonth()+1,n.getDate(),n.getHours(),n.getMinutes(),n.getSeconds(),n.getDay()||7,0,0]);slog('ustawiono zegar wagi')}catch(e){slog('pominięto ustawienie zegara: '+e.message)}
    try{const lc=await bc.getCharacteristic(MI.bcm);lc.addEventListener('characteristicvaluechanged',onScaleData);await lc.startNotifications();slog('nasłuch pomiaru bieżącego (2a9c)')}catch(e){slog('brak 2a9c: '+e.message)}
    const hc=await bc.getCharacteristic(MI.hist);SC.hc=hc;hc.addEventListener('characteristicvaluechanged',onScaleData);await hc.startNotifications();
    const id=scaleId();await wv(hc,[0x01,0xff,0xff,id>>8,id&0xff]);
    sstat('Pobieram pomiary zapisane w wadze…');await wv(hc,[0x02]);
    SC.histT=setTimeout(()=>finishScale('timeout'),20000);
  }catch(e){
    SC.busy=false;
    sstat(e.name==='NotFoundError'?'Nie wybrano wagi. Stań na wadze (wyświetlacz musi świecić) i spróbuj ponownie.':e.name==='NetworkError'?'Nie udało się połączyć — waga mogła zasnąć. Stań na niej i od razu kliknij „Połącz”. Zamknij też Zepp Life, jeśli jest otwarte.':e.name==='SecurityError'?'Przeglądarka zablokowała Bluetooth. Zezwól na „Urządzenia w pobliżu” dla Chrome.':'Błąd: '+e.message);
    render();
  }
}
async function finishScale(why){
  clearTimeout(SC.histT);if(SC.done)return;SC.done=true;
  try{if(why==='end'&&SC.hc){await wv(SC.hc,[0x03]);const id=scaleId();await wv(SC.hc,[0x04,0xff,0xff,id>>8,id&0xff])}}catch(e){slog('potwierdzenie: '+e.message)}
  sstat(SC.got?`Gotowe — zapisano ${SC.got} ${plural(SC.got,'pomiar','pomiary','pomiarów')}${SC.pending.length?`, ${SC.pending.length} do potwierdzenia`:''}. Możesz zostać na wadze jeszcze 30 s, żeby dodać bieżący pomiar.`:why==='timeout'?'Waga nie przesłała pomiarów. Zejdź z wagi, wejdź jeszcze raz i poczekaj, aż wynik zamiga.':`Brak nowych pomiarów w wadze${SC.pending.length?` (${SC.pending.length} do potwierdzenia)`:''}. Stań na wadze — bieżący pomiar zapisze się w ciągu 30 s.`);
  SC.busy=false;render();
  setTimeout(()=>{try{SC.dev?.gatt?.connected&&SC.dev.gatt.disconnect()}catch(e){}},30000);
}

/* ---------- timers ---------- */
let T=null,tInt=null,actx=null;
function startTimer(sec,kind='set'){if(!(sec>0))return;T={end:Date.now()+sec*1000,total:sec,done:false,kind};clearInterval(tInt);tInt=setInterval(tick,250);tick()}
function tick(){
  const el=$('#timer');if(!T){el.hidden=true;clearInterval(tInt);return}
  const left=(T.end-Date.now())/1000;const exk=T.kind==='ex';
  if(left<=0&&!T.done){T.done=true;exk?chime([0,0.22,0.44,0.66],740):chime([0,0.25,0.5],880);vib(exk?[300,120,300,120,300]:[200,100,200])}
  el.hidden=false;el.className='timer'+(exk?' ex':'')+(T.done?' done':'');
  const pct=T.done?100:Math.min(100,(1-left/T.total)*100);
  const lbl=T.done?(exk?'<b>Następne ćwiczenie</b><small>przerwa minęła</small>':'<b>Czas na serię</b><small>przerwa minęła</small>'):(exk?'<b>Przerwa</b><small>między ćwiczeniami</small>':'<b>Przerwa</b><small>między seriami</small>');
  el.innerHTML=`<div class="in"><div class="bar" style="width:${pct}%"></div><span class="lbl">${lbl}</span><span class="t">${T.done?mmss(-left):mmss(left)}</span><span class="spacer"></span>${T.done?'':`<button data-act="tAdj" data-v="-15">−15</button><button data-act="tAdj" data-v="15">+15</button>`}<button data-act="tStop" aria-label="Zamknij minutnik">×</button></div>`;
  if(T.done&&left<-120){T=null;el.hidden=true;clearInterval(tInt)}
}
function tone(f,dur=0.18,at=0,vol=0.32){try{if(!actx)return;if(actx.state==='suspended')actx.resume();const t0=actx.currentTime+at;const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.start(t0);o.stop(t0+dur+0.02)}catch(e){}}
function chime(times,f){times.forEach(t=>tone(f,0.18,t))}
const vib=p=>{try{navigator.vibrate?.(p)}catch(e){}};
let wl=null;async function wake(){try{if(!wl&&navigator.wakeLock)wl=await navigator.wakeLock.request('screen');wl?.addEventListener?.('release',()=>{wl=null})}catch(e){}}

/* interval runner: prep 5 s → work → rest → … with sounds at every change */
let IV=null,ivInt=null;
function ivStart(){
  const s=ui.sheet;const w=Math.max(5,Math.round(num(s.iw))),r=Math.max(0,Math.round(num(s.ir))),n=Math.max(1,Math.min(99,Math.round(num(s.in))));
  S.profile.settings.ivl={w,r,n};queueSave('profile');T=null;tick();
  IV={ex:s.ex,date:ui.date,w,r,n,round:1,phase:'prep',end:Date.now()+5000,paused:null,lastBeep:null,kg:num(s.w),logged:0};
  ui.sheet=null;render();wake();tone(660,0.12);clearInterval(ivInt);ivInt=setInterval(ivTick,100);ivTick();
}
function ivTick(){
  if(!IV){clearInterval(ivInt);renderIvl();return}
  if(!IV.paused&&IV.phase!=='done'){
    let guard=0;while(IV&&IV.phase!=='done'&&IV.end<=Date.now()&&guard++<400)ivAdvance();
    if(IV&&IV.phase!=='done'){const sec=Math.ceil((IV.end-Date.now())/1000);if(sec<=3&&sec>=1&&sec!==IV.lastBeep){IV.lastBeep=sec;tone(660,0.1)}}
  }
  renderIvl();
}
function ivAdvance(){
  IV.lastBeep=null;
  if(IV.phase==='prep'){IV.phase='work';IV.end+=IV.w*1000;tone(1046,0.55);vib([350]);return}
  if(IV.phase==='work'){ivLog();
    if(IV.round>=IV.n){IV.phase='done';tone(880,0.2);tone(1046,0.2,0.25);tone(1318,0.5,0.5);vib([200,100,200,100,500]);return}
    if(IV.r>0){IV.phase='rest';IV.end+=IV.r*1000;tone(523,0.22);tone(523,0.22,0.3);vib([150,80,150]);return}
    IV.round++;IV.end+=IV.w*1000;tone(1046,0.55);vib([350]);return}
  if(IV.phase==='rest'){IV.round++;IV.phase='work';IV.end+=IV.w*1000;tone(1046,0.55);vib([350])}
}
function ivLog(){
  const e=ex(IV.ex);if(!e)return;const w=W(IV.date,true);let en=w.entries.find(x=>x.ex===IV.ex);if(!en){en={ex:IV.ex,sets:[]};w.entries.push(en)}
  en.sets.push(e.type==='time'?{w:0,r:IV.w}:{w:e.type==='w'?IV.kg:0,r:0,s:IV.w});IV.logged++;
  if(IV.date===today()&&!w.start)w.start=Date.now();queueSave('w_'+IV.date);
}
function renderIvl(){
  const el=$('#ivl');if(!IV){if(!el.hidden){el.hidden=true;el.innerHTML='';render()}return}
  const e=ex(IV.ex);const left=IV.phase==='done'?0:Math.max(0,((IV.paused??(IV.end-Date.now())))/1000);
  const dur=IV.phase==='prep'?5:IV.phase==='work'?IV.w:IV.r;const pct=IV.phase==='done'?100:Math.min(100,(1-left/dur)*100);
  const ph={prep:'Przygotuj się',work:'Praca',rest:'Przerwa',done:'Koniec'}[IV.phase];
  const next=IV.phase==='work'?(IV.round>=IV.n?'Ostatnia runda':IV.r?`potem przerwa ${IV.r} s`:'potem kolejna runda'):IV.phase==='rest'?`następnie praca ${IV.w} s`:IV.phase==='prep'?`praca ${IV.w} s · przerwa ${IV.r} s · ${IV.n} ${plural(IV.n,'runda','rundy','rund')}`:`Zapisano ${IV.logged} ${plural(IV.logged,'serię','serie','serii')} po ${IV.w} s.`;
  el.hidden=false;el.className='ivl '+IV.phase;
  el.innerHTML=`<div class="ivex">${esc(e?.name||'')}</div><div class="meta">Runda ${Math.min(IV.round,IV.n)} z ${IV.n}</div><div class="ph">${ph}</div>
  ${IV.phase==='done'?'':`<div class="tm">${left>=60?mmss(Math.ceil(left)):Math.ceil(left)}</div><div class="pbar"><i style="width:${pct}%"></i></div>`}
  <div class="meta">${next}</div>
  <div class="btns">${IV.phase==='done'?`<button data-act="ivReps">Wpisz powtórzenia</button><button data-act="ivClose">Zamknij</button>`:`<button data-act="ivPause">${IV.paused!=null?'Wznów':'Pauza'}</button><button data-act="ivSkip">Pomiń</button><button data-act="ivStop">Zakończ</button>`}</div>`;
}

/* ---------- photos: IndexedDB on the device + private Supabase Storage ---------- */
const BUCKET='gv-photos';
const IDB={p:null,
  open(){return this.p??=new Promise((res,rej)=>{const r=indexedDB.open('gymventory',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async run(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('photos',mode);const out=fn(t.objectStore('photos'));t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)})},
  async get(k){const q=await this.run('readonly',st=>st.get(k));return q.result||null},
  put(k,v){return this.run('readwrite',st=>{st.put(v,k)})},
  del(k){return this.run('readwrite',st=>{st.delete(k)})},
  async entries(){const o=await this.run('readonly',st=>({k:st.getAllKeys(),v:st.getAll()}));return o.k.result.map((k,i)=>[k,o.v.result[i]])}
};
const PH={};
async function stFetch(method,path,body){
  await ensureToken();const h={apikey:CFG.key,Authorization:'Bearer '+AUTH.access_token};if(body){h['Content-Type']='image/jpeg';h['x-upsert']='true'}
  const base=method==='GET'?'/storage/v1/object/authenticated/':'/storage/v1/object/';
  let r;try{r=await fetch(`${CFG.url}${base}${BUCKET}/${AUTH.user.id}/${path}`,{method,headers:h,body})}catch(e){throw new ApiErr(0,'offline')}
  if(!r.ok)throw new ApiErr(r.status,'storage '+r.status);return r;
}
async function photoUrl(path){
  if(PH[path])return PH[path];
  let rec=null;try{rec=await IDB.get(path)}catch(e){}
  if(!rec&&CFG&&AUTH){try{const b=await (await stFetch('GET',path)).blob();rec={blob:b,pending:false};IDB.put(path,rec).catch(()=>{})}catch(e){return null}}
  if(!rec)return null;return PH[path]=URL.createObjectURL(rec.blob);
}
function hydratePhotos(root=document){root.querySelectorAll('img[data-photo]:not([data-ok])').forEach(img=>{img.dataset.ok='1';photoUrl(img.dataset.photo).then(u=>{if(u)img.src=u;else img.alt='Zdjęcie dostępne po połączeniu z internetem'})})}
async function compressImage(file){
  let src;try{src=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=URL.createObjectURL(file)})}
  const M=1280,sc=Math.min(1,M/Math.max(src.width,src.height));const c=document.createElement('canvas');c.width=Math.round(src.width*sc);c.height=Math.round(src.height*sc);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',0.82));
}
async function addPhoto(exId,file){
  const e=ex(exId);if(!e)return;toast('Dodaję zdjęcie…');
  try{const blob=await compressImage(file);const id=nid();const path=`${exId}/${id}.jpg`;await IDB.put(path,{blob,pending:true});
    (e.photos??=[]).push({id,path});queueSave('profile');render();toast('Zdjęcie dodane');uploadPending()}
  catch(err){toast('Nie udało się dodać zdjęcia')}
}
let uploading=false;
async function uploadPending(){
  if(!CFG||!AUTH||uploading)return;uploading=true;
  try{for(const [k,v] of await IDB.entries()){if(!v?.pending)continue;try{await stFetch('POST',k,v.blob);v.pending=false;await IDB.put(k,v)}catch(e){if(e.status===0)break}}}catch(e){}
  finally{uploading=false}
}
async function delPhoto(exId,id){
  const e=ex(exId);const p=(e?.photos||[]).find(x=>x.id===id);if(!p)return;
  e.photos=e.photos.filter(x=>x.id!==id);queueSave('profile');
  IDB.del(p.path).catch(()=>{});if(PH[p.path]){URL.revokeObjectURL(PH[p.path]);delete PH[p.path]}
  if(CFG&&AUTH)stFetch('DELETE',p.path).catch(()=>{});
}

function chValue(c){
  let v=0;const exn=(c.exercise||'').trim().toLowerCase();
  for(const d in S.workouts){if(d<c.start_date||d>c.end_date)continue;const w=S.workouts[d];if(!w.entries?.length)continue;
    if(c.kind==='workouts'){v++;continue}
    for(const en of w.entries){const e=ex(en.ex);if(!e)continue;const ws=(en.sets||[]).filter(x=>!x.wu);
      if(c.kind==='sets')v+=ws.length;
      else if(c.kind==='volume'){if(e.type==='w'||e.type==='bw')v+=ws.reduce((t,x)=>t+(x.w||0)*(x.r||0),0)/1000}
      else if(c.kind==='cardio_km'){if(e.type==='cardio')v+=ws.reduce((t,x)=>t+(x.d||0),0)}
      else if(e.name.trim().toLowerCase()===exn){if(c.kind==='ex_reps')v+=ws.reduce((t,x)=>t+(x.r||0),0);else if(c.kind==='ex_max')v=Math.max(v,...ws.map(x=>x.w||0))}}}
  return Math.round(v*100)/100;
}
async function syncChallenges(){

    const v=chValue(c);if(Math.abs((+mine.value||0)-v)<1e-9)continue;
    await rest(`gv_challenge_members?challenge_id=eq.${c.id}&user_id=eq.${uid}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({value:v,updated_at:new Date().toISOString()})});mine.value=v}
}

    const dist=c.dist>=0?num(r[c.dist])*(c.dunit>=0&&/mi/i.test(r[c.dunit]||'')?1.609344:1):0;
    const reps=c.r>=0?Math.round(num(r[c.r])):0;const secs=c.t>=0?toSecs(r[c.t]):0;
    let w=0;if(c.wkg>=0&&r[c.wkg]!==''){w=num(r[c.wkg]);if(c.unit>=0&&/lb/i.test(r[c.unit]||'')){w*=0.45359237;lbs=true}}else if(c.wlb>=0){w=num(r[c.wlb])*0.45359237;if(w)lbs=true}
    w=Math.round(w*100)/100;
    if(!e){const raw=(c.cat>=0?r[c.cat]:'').trim();const cat=CAT_EN[raw.toLowerCase()]||(raw?raw[0].toUpperCase()+raw.slice(1):'Inne');e={id:nid(),name,cat,type:!reps&&secs?(dist?'cardio':'time'):(!w?'bw':'w'),_new:1};byName[name.toLowerCase()]=e;newEx.push(e)}
    else if(e._new&&w>0&&e.type==='bw')e.type='w';
    if(exist[d]?.has(e.id)){const k=d+e.id;if(!skipKey.has(k)){skipKey.add(k);skipped++}continue}
    let set;if(e.type==='cardio'){set={w:0,r:Math.round(secs)};if(dist)set.d=Math.round(dist*100)/100;if(c.spd>=0&&num(r[c.spd]))set.v=num(r[c.spd]);if(c.inc>=0&&r[c.inc]!=='')set.inc=num(r[c.inc]);if(c.met>=0&&num(r[c.met]))set.met=num(r[c.met])}else set=e.type==='time'?{w:0,r:Math.round(secs)}:{w,r:reps};if(set.r<=0)continue;
    if(c.rpe>=0&&num(r[c.rpe])>0)set.rpe=num(r[c.rpe]);
    if(c.wu>=0&&/warm|rozgrz|^r$|^w$|tak|yes|true|1/i.test(r[c.wu]||''))set.wu=true;
    const day=days[d]??={};const en=day[e.id]??={ex:e.id,sets:[]};en.sets.push(set);
    if(c.n>=0&&r[c.n]&&!en.note)en.note=r[c.n].trim();sets++;
  }
  newEx.forEach(e=>{if(e.type==='bw'&&!Object.values(days).some(d=>d[e.id]?.sets.some(s=>s.r>0)))e.type='w'});
  return {file,kind:'plik CSV',days,newEx,sets,skipped,lbs,dates:Object.keys(days).sort()};
}
function planJson(txt,file){
  let j;try{j=JSON.parse(txt)}catch(e){return {error:'To nie jest poprawny plik kopii zapasowej (JSON).'}}
  if(!j||!['gymventory','seria'].includes(j.app)||!j.profile||!j.workouts)return {error:'Ten plik JSON nie jest kopią zapasową Gymventory.'};
  const byName={};S.profile.exercises.forEach(e=>byName[e.name.toLowerCase()]=e);
  const map={},newEx=[];for(const e of j.profile.exercises||[]){const m=byName[e.name.toLowerCase()];if(m)map[e.id]=m.id;else{const n={...e,id:nid(),_new:1};newEx.push(n);map[e.id]=n.id;byName[e.name.toLowerCase()]=n}}
  const exist={};for(const d in S.workouts)exist[d]=new Set(S.workouts[d].entries.map(x=>x.ex));
  const days={};let sets=0,skipped=0;
  for(const d in j.workouts){const w=j.workouts[d];for(const en of w.entries||[]){const id=map[en.ex];if(!id)continue;if(exist[d]?.has(id)){skipped++;continue}(days[d]??={})[id]={ex:id,sets:clone(en.sets||[]),...(en.note?{note:en.note}:{})};sets+=(en.sets||[]).length}}
  const haveB=new Set(S.profile.body.map(b=>b.d));const body=(j.profile.body||[]).filter(b=>!haveB.has(b.d));
  const haveR=new Set(S.profile.routines.map(r=>r.name.toLowerCase()));const routines=(j.profile.routines||[]).filter(r=>!haveR.has(r.name.toLowerCase())).map(r=>({id:nid(),name:r.name,items:r.items.map(i=>map[i]).filter(Boolean)}));
  return {file,kind:'kopia zapasowa Gymventory',days,newEx,sets,skipped,dates:Object.keys(days).sort(),body:body.length,routines:routines.length,_body:body,_routines:routines};
}
async function readImport(f){
  setImp({busy:'Czytam plik…'});
  try{const txt=(await f.text()).replace(/^﻿/,'');const isJson=/\.json$/i.test(f.name)||/^\s*[{[]/.test(txt);
    const p=isJson?planJson(txt,f.name):planCsv(txt,f.name);
    if(!p.error&&!p.sets&&!p.body&&!p.routines&&!p.skipped)p.error='Nie znalazłem w pliku żadnych serii z ciężarem, powtórzeniami albo czasem.';
    setImp(p);
  }catch(e){setImp({error:'Nie udało się odczytać pliku.'})}
  finally{const i=$('#impIn');if(i)i.value=''}
}
const impMsg=(n,nd)=>`Zaimportowano ${n} ${plural(n,'serię','serie','serii')} z ${nd} ${plural(nd,'dnia','dni','dni')}.`;
async function runImport(){
  const p=IMP;if(!p||!p.days)return;
  for(const e of p.newEx){const x={...e};delete x._new;S.profile.exercises.push(x)}
  if(p._body)S.profile.body.push(...p._body);if(p._routines)S.profile.routines.push(...p._routines);
  for(const d of p.dates){const w=W(d,true);for(const id in p.days[d])w.entries.push(p.days[d][id])}
  const n=p.sets,nd=p.dates.length;
  if(p.newEx.length||p._body?.length||p._routines?.length)queueSave('profile');
  bump();
  for(const d of p.dates)markDirty('w_'+d);saveLocal();clearTimeout(tPush);push();
  IMP={done:impMsg(n,nd)};render();toast('Import zakończony');
}
function buildCsv(){
  const q=s=>/[",\n;]/.test(String(s))?`"${String(s).replace(/"/g,'""')}"`:s;
  const lines=['Data,Trening,Ćwiczenie,Partia,Ciężar (kg),Powtórzenia,Czas (s),Dystans (km),Prędkość (km/h),Nachylenie (%),MET,RPE,Rozgrzewka,Notatka'];
  for(const d of Object.keys(S.workouts).sort()){const w=S.workouts[d];for(const en of w.entries){const e=ex(en.ex);if(!e)continue;for(const x of en.sets){const isT=e.type==='time'||e.type==='cardio';
    lines.push([d,q(w.title||''),q(e.name),q(e.cat),isT?'':x.w,isT?'':(x.r||''),isT?x.r:(x.s||''),x.d??'',x.v??'',x.inc??'',x.met??'',x.rpe??'',x.wu?'tak':'',q(en.note||'')].join(','))}}}
  return lines.join('\n');
}
function saveFile(name,data,type){try{const b=new Blob([data],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Plik zapisany: '+name)}catch(e){toast('Nie udało się zapisać pliku')}}
function doExport(){saveFile(`gymventory-${today()}.csv`,'\uFEFF'+buildCsv(),'text/csv;charset=utf-8')}
function doBackup(){flushAll();saveFile(`gymventory-kopia-${today()}.json`,JSON.stringify({app:'gymventory',v:1,saved:new Date().toISOString(),profile:S.profile,workouts:S.workouts}),'application/json')}

boot();
})();
